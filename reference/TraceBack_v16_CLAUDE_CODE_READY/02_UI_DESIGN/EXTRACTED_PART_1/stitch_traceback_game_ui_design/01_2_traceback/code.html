<!-- Interactive Client-side Script for Cutscene Controls -->
<script>
    (function() {
      const autoBtn = document.getElementById('auto-btn');
      const nextTrigger = document.getElementById('next-trigger');
      const dialogueLine = document.getElementById('dialogue-line');
      let isAuto = false;
      let autoTimer = null;

      // Dialogue Pool for Interactive Stepping
      const storyLines = [
        "“모든 게 거짓이었어… 믿었던 스폰서 녀석이 우승 상금 전액을 빼돌려 저택으로 도망쳤다고? 통장 잔고가… <span class='text-secondary font-extrabold underline decoration-secondary-fixed decoration-4'>0원이야…</span>”",
        "“찢겨진 계약서 조각에 찍힌 스탬프… 남작의 비밀 인장이 분명해. 여기서 주저앉아 울고만 있을 순 없어!”",
        "“엔진 정비용 남은 스패너 하나라도 챙겨. 우리가 직접 그 사기꾼의 은신처를 찾아가 모든 걸 되찾아올 거야!”"
      ];
      let lineIndex = 0;

      function advanceDialogue() {
        lineIndex = (lineIndex + 1) % storyLines.length;
        dialogueLine.style.opacity = '0';
        dialogueLine.style.transform = 'translateY(4px)';
        
        setTimeout(() => {
          dialogueLine.innerHTML = storyLines[lineIndex];
          dialogueLine.style.transition = 'opacity 0.2s ease, transform 0.2s ease';
          dialogueLine.style.opacity = '1';
          dialogueLine.style.transform = 'translateY(0)';
        }, 150);
      }

      if (nextTrigger) {
        nextTrigger.addEventListener('click', () => {
          advanceDialogue();
        });
      }

      // Keyboard Controls (SPACE / ENTER)
      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'Enter') {
          e.preventDefault();
          advanceDialogue();
        }
      });

      // Auto Mode Toggle
      if (autoBtn) {
        autoBtn.addEventListener('click', () => {
          isAuto = !isAuto;
          if (isAuto) {
            autoBtn.classList.add('active', 'bg-primary-fixed', 'text-on-primary-fixed');
            autoTimer = setInterval(advanceDialogue, 3500);
          } else {
            autoBtn.classList.remove('active', 'bg-primary-fixed', 'text-on-primary-fixed');
            clearInterval(autoTimer);
          }
        });
      }
    })();
  </script>

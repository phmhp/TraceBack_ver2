<script>
  // Interactive prologue cutscene trigger bindings
  (function() {
    const nextBtn = document.getElementById('btn-next');
    const skipBtn = document.getElementById('btn-skip');
    const autoBtn = document.getElementById('btn-auto');

    function advanceScene() {
      if (nextBtn) {
        nextBtn.classList.add('scale-95', 'opacity-80');
        setTimeout(() => {
          nextBtn.classList.remove('scale-95', 'opacity-80');
        }, 150);
      }
    }

    if (nextBtn) {
      nextBtn.addEventListener('click', advanceScene);
    }
    if (skipBtn) {
      skipBtn.addEventListener('click', advanceScene);
    }

    // Spacebar & Enter Hotkey handling
    window.addEventListener('keydown', function(e) {
      if (e.code === 'Space' || e.code === 'Enter') {
        e.preventDefault();
        advanceScene();
      }
    });

    let autoActive = false;
    if (autoBtn) {
      autoBtn.addEventListener('click', function() {
        autoActive = !autoActive;
        const dot = autoBtn.querySelector('span:first-child');
        if (autoActive) {
          autoBtn.classList.replace('bg-surface-container-high/90', 'bg-primary');
          autoBtn.classList.replace('text-on-surface', 'text-on-primary');
          if (dot) dot.classList.replace('bg-primary-fixed-dim', 'bg-surface-container-lowest');
        } else {
          autoBtn.classList.replace('bg-primary', 'bg-surface-container-high/90');
          autoBtn.classList.replace('text-on-primary', 'text-on-surface');
          if (dot) dot.classList.replace('bg-surface-container-lowest', 'bg-primary-fixed-dim');
        }
      });
    }
  })();

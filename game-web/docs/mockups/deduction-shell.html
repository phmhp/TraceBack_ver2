<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>추리 단계 공통 화면 시안 v3</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
<style>
  /* glossy (Frutiger Aero) + clay controls, compact type */
  /* v3: rose · mauve · warm-brown palette, lightly translucent glossy panels over the original background */
  :root {
    --ink: #3e2f2c; --ink-soft: #7a6660;
    --rose: #e9a9a6; --rose-2: #c97a78; --mauve: #b79cc7; --plum: #8a5a44; --plum-2: #613b2b;
    --brown: #8a6650; --cream: #fbf3ec; --sun: #f2cf8a;
  }
  * { box-sizing: border-box; font-family: Pretendard, system-ui, sans-serif; word-break: keep-all; }
  h1, h2, b, span, button, small { text-wrap: balance; }
  body { margin: 0; color: var(--ink); font-size: 13px; overflow: hidden; background: #3b2a2a url("/assets/stitch23/investigation-lab.png") center/cover fixed; }
  body::before { content: ""; position: fixed; inset: 0; background: linear-gradient(180deg, rgba(120,80,110,.18), rgba(90,60,50,.28)); pointer-events: none; }
  .stage { position: relative; max-width: 1180px; height: calc(100vh - 44px); margin: 0 auto; padding: 12px; display: grid; grid-template-rows: 48px 40px 42px minmax(0, 1fr) 58px; gap: 8px; }
  /* glossy panel: nearly opaque white→sky body with a glass highlight band; no doubled outlines */
  .aero { position: relative; border-radius: 16px; background: linear-gradient(180deg, rgba(255,250,247,.9) 0%, rgba(250,239,236,.86) 100%);
    backdrop-filter: blur(10px) saturate(1.15); box-shadow: 0 1px 0 rgba(255,255,255,.9) inset, 0 0 0 1px rgba(150,100,110,.18), 0 8px 18px rgba(60,30,40,.22); overflow: hidden; }
  .aero::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 46%; border-radius: 16px 16px 40% 40% / 16px 16px 14px 14px;
    background: linear-gradient(180deg, rgba(255,255,255,.7), rgba(255,255,255,0)); pointer-events: none; }
  .aero > * { position: relative; }
  .row { display: flex; align-items: center; gap: 10px; padding: 0 14px; }
  .logo { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 15px; } .logo img { width: 32px; height: 32px; border-radius: 50%; background: #fff; object-fit: cover; }
  /* clay chip / button: puffy with soft inner light and shade */
  .clay { border: 0; border-radius: 999px; padding: 5px 11px; font-weight: 700; font-size: 12px; color: var(--ink); background: #fff; cursor: pointer;
    box-shadow: inset 2px 2px 4px #ffffff, inset -2px -3px 5px rgba(110,70,80,.14), 0 2px 5px rgba(70,40,50,.16); }
  .clay.sun { background: linear-gradient(180deg, #f8ddb0, var(--sun)); color: #5b3e17; }
  .clay.leaf { background: linear-gradient(180deg, #e3c3b2, #c99a82); color: #4a2c1e; }
  .clay.soft { background: #f6ebe8; color: var(--ink-soft); }
  .dots { margin-left: auto; display: flex; gap: 6px; } .dots i { width: 20px; height: 20px; display: grid; place-items: center; border-radius: 50%; font: 800 10px Pretendard; font-style: normal; background: #f4e9e6; color: #a38f88; box-shadow: inset 1px 1px 2px #fff, inset -1px -2px 3px rgba(0,0,0,.08); }
  .dots i.done { background: linear-gradient(180deg, #c99a82, #a06e55); color: #fff; } .dots i.now { background: linear-gradient(180deg, #f3c0bd, var(--rose-2)); color: #fff; }
  .dots img { width: 11px; filter: brightness(10); }
  .pursuit { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; }
  .gapNum { font-weight: 800; font-size: 15px; color: var(--rose-2); } .gapNum small { font-size: 11px; color: var(--ink-soft); margin-right: 4px; font-weight: 700; }
  .track { position: relative; height: 10px; border-radius: 999px; background: #efe2df; box-shadow: inset 1px 2px 3px rgba(80,40,50,.2); }
  .track .gap { position: absolute; left: 30%; width: 22%; top: 0; bottom: 0; border-radius: 999px; background: linear-gradient(90deg, var(--rose), #c99a82); }
  .track img { position: absolute; top: 50%; translate: -50% -55%; width: 34px; }
  .lives { display: flex; gap: 4px; align-items: center; } .lives b { width: 12px; height: 12px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #f7d0ce, var(--rose-2) 60%); box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .mission { justify-content: space-between; }
  .mission p { margin: 0; font-size: 14px; font-weight: 700; } .mission p em { font-style: normal; color: var(--plum); }
  .steps { display: flex; gap: 5px; }
  .work { padding: 12px; display: grid; grid-template-columns: minmax(0, 1fr) 240px; gap: 12px; min-height: 0; }
  .board { border-radius: 12px; background: rgba(255,250,246,.7); box-shadow: inset 0 0 0 1px rgba(150,100,110,.16); display: grid; place-items: center; color: var(--ink-soft); font-weight: 600; }
  .side { display: grid; align-content: start; gap: 6px; }
  .side h3 { margin: 2px 0; font-size: 12px; color: var(--ink-soft); }
  .note { padding: 8px 10px; border-radius: 12px; background: #fff; font-size: 12.5px; font-weight: 600; line-height: 1.4;
    box-shadow: inset 2px 2px 3px #fff, inset -2px -2px 4px rgba(110,70,80,.08), 0 1px 3px rgba(70,40,50,.14); }
  .note.ok { background: #f6ece4; } .note.bad { background: #fbe8e6; }
  .foot { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 0 8px 0 12px; }
  .ming { display: flex; gap: 10px; align-items: center; font-size: 13px; font-weight: 600; } .ming img { width: 38px; height: 38px; border-radius: 50%; background: #fff; object-fit: cover; box-shadow: 0 2px 4px rgba(60,30,40,.2); } .ming b { color: var(--plum); margin-right: 4px; }
  /* jelly primary: glossy clay that squashes when pressed */
  .cta { border: 0; border-radius: 16px; padding: 10px 20px; font-size: 14px; font-weight: 800; color: #fff; cursor: pointer;
    background: linear-gradient(180deg, #b7856c 0%, var(--plum) 60%, #714634 100%);
    box-shadow: inset 0 2px 1px rgba(255,255,255,.55), inset 0 -3px 4px rgba(50,20,10,.25), 0 4px 0 var(--plum-2), 0 8px 12px rgba(97,59,43,.35);
    transition: transform .12s cubic-bezier(.3,1.7,.5,1), box-shadow .12s; }
  .cta:active { transform: translateY(3px) scale(1.04, .93); box-shadow: inset 0 2px 1px rgba(255,255,255,.55), inset 0 -2px 3px rgba(50,20,10,.25), 0 1px 0 var(--plum-2), 0 3px 6px rgba(97,59,43,.3); }
  .swap { position: fixed; left: 50%; translate: -50% 0; bottom: 8px; display: flex; gap: 6px; }
  .swap button.on { background: linear-gradient(180deg, #8a5a44, #613b2b); color: #fff; }
</style>
</head>
<body>
<div class="swap"><button class="clay on" data-s="0">원인 역추적</button><button class="clay" data-s="1">정상 동작 복원</button><button class="clay" data-s="2">시뮬레이션 검증</button></div>
<div class="stage">
  <header class="aero row"><span class="logo"><img src="/assets/ASSET_003_Cat_Face_Identity_REFERENCE.png" alt="" />TraceBack</span><span class="clay sun" id="pill"></span><span class="dots" id="dots"></span></header>
  <section class="aero row pursuit"><span class="gapNum"><small>추격차와</small>72 m</span><div class="track"><span class="gap"></span><img src="/assets/ui/icons/police-car.svg" style="left:30%" alt="" /><img src="/assets/ui/icons/getaway-car.svg" style="left:52%" alt="" /></div><span class="lives"><b></b><b></b><b></b></span></section>
  <section class="aero row mission"><p id="mission"></p><span class="steps" id="steps"></span><button class="clay">방법 보기</button></section>
  <main class="aero work"><div class="board" id="board"></div><aside class="side" id="side"></aside></main>
  <footer class="aero foot"><div class="ming"><img src="/assets/ASSET_003_Cat_Face_Identity_REFERENCE.png" alt="" /><span><b>밍</b><span id="ming"></span></span></div><button class="cta" id="cta"></button></footer>
</div>
<script>
  const S = [
    { pill: "4/8 원인 역추적", mission: "증상에서 거슬러 올라가 <em>처음 어긋난 구간</em>을 좁힙니다", steps: ["거꾸로 따라가기", "의심 구간", "영향 범위"], board: "도미노 줄 + 측정 카드 3장", side: '<h3>측정 기록</h3><div class="note bad">차량 가속 · 기준 2.8 → 1.2 m/s²</div><div class="note">후보를 선택해 측정</div>', ming: "먼저 어긋난 값이 원인 쪽입니다. 측정 시각을 비교하세요.", cta: "시작점 확정", now: 4 },
    { pill: "5/8 정상 동작 복원", mission: "의심 구간의 <em>정상 동작</em>을 요구사항 기준으로 복원합니다", steps: ["빈칸 채우기", "실행해서 확인"], board: "퍼즐판 (입력 → 출력) + 남은 조각", side: '<h3>요구사항</h3><div class="note ok">페달 60%는 토크 204 Nm</div><div class="note">D단 · READY일 때만 통과</div><div class="note">토크는 천천히 올린다</div>', ming: "빈칸 3곳을 채운 뒤 실행해 기대값과 비교하세요.", cta: "실행해서 확인", now: 5 },
    { pill: "6/8 시뮬레이션 검증", mission: "같은 입력으로 <em>정상 설계와 현장 대상</em>을 비교해 원인을 확정합니다", steps: ["레벨", "방법", "비교", "고치기", "회귀"], board: "레벨 탭 (환경 칩) + 시뮬레이션 화면", side: '<h3>관측점</h3><div class="note">입력 자극 · 60%</div><div class="note bad">처리값 · 27% (기준 60%)</div>', ming: "가장 먼저 갈라진 신호를 지목하세요.", cta: "시험 실행", now: 6 },
  ];
  const render = k => {
    const s = S[k];
    pill.textContent = s.pill; mission.innerHTML = s.mission; board.textContent = s.board; side.innerHTML = s.side; ming.textContent = s.ming; cta.textContent = s.cta;
    steps.innerHTML = s.steps.map((t, i) => `<span class="clay ${i === 0 ? "leaf" : "soft"}">${i + 1} ${t}</span>`).join("");
    dots.innerHTML = Array.from({ length: 8 }, (_, i) => { const n = i + 1; return n < s.now ? '<i class="done"><img src="/assets/ui/icons/check.svg" alt=""></i>' : `<i class="${n === s.now ? "now" : ""}">${n}</i>`; }).join("");
  };
  document.querySelectorAll(".swap button").forEach(b => b.onclick = () => { document.querySelectorAll(".swap button").forEach(x => x.classList.toggle("on", x === b)); render(+b.dataset.s); });
  render(0);
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>방향 A · 말풍선 젤리</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
<style>
  /* A: island-poster mood — cream speech-bubble cards, tilted ribbon tags, glossy jelly buttons */
  * { box-sizing: border-box; font-family: Pretendard, system-ui, sans-serif; word-break: keep-all; }
  body { margin: 0; height: 100vh; overflow: hidden; color: #4a3b33; font-size: 13px;
    background: repeating-linear-gradient(135deg, #8fd16f 0 18px, #86c967 18px 36px); }
  body::before { content: ""; position: fixed; inset: 0; background: radial-gradient(circle at 20% 15%, #ffffff55 0 10%, transparent 30%), linear-gradient(180deg, #bfe9f7 0, #bfe9f700 22%); pointer-events: none; }
  .stage { position: relative; max-width: 1160px; height: 100vh; margin: 0 auto; padding: 14px; display: grid; grid-template-rows: 46px 40px minmax(0, 1fr) 64px; gap: 12px; }
  .bubble { position: relative; background: #fffbe9; border-radius: 26px; box-shadow: 0 4px 0 #e8dcb5, 0 10px 18px rgba(40,70,30,.18); }
  .row { display: flex; align-items: center; gap: 10px; padding: 0 16px; }
  .ribbon { position: absolute; top: -14px; left: 26px; padding: 4px 16px; border-radius: 999px; transform: rotate(-4deg); font-weight: 700; font-size: 13px; color: #fff; background: #f07ea0; box-shadow: 0 3px 0 #c95c7d; }
  .ribbon.teal { background: #3fbfb4; box-shadow: 0 3px 0 #2a958c; } .ribbon.brown { background: #c9906e; box-shadow: 0 3px 0 #9f6c4e; }
  .logo { display: flex; align-items: center; gap: 8px; font-weight: 700; } .logo img { width: 32px; height: 32px; border-radius: 50%; background: #fff; object-fit: cover; }
  .pill { padding: 4px 12px; border-radius: 999px; background: #ffe58a; font-weight: 600; font-size: 12px; color: #6b4c00; }
  .dots { margin-left: auto; display: flex; gap: 6px; } .dots i { width: 20px; height: 20px; border-radius: 50%; background: #eee5c7; display: grid; place-items: center; font: 600 10px Pretendard; font-style: normal; color: #a08f6b; }
  .dots i.done { background: #6cc49a; color: #fff; } .dots i.now { background: #f07ea0; color: #fff; }
  .pursuit { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; }
  .pursuit b { font-weight: 700; color: #e0587f; }
  .track { position: relative; height: 10px; border-radius: 999px; background: #efe6c8; }
  .track span { position: absolute; left: 30%; width: 22%; top: 0; bottom: 0; border-radius: 999px; background: #f6a5bd; }
  .track img { position: absolute; top: 50%; translate: -50% -55%; width: 34px; }
  .work { display: grid; grid-template-columns: minmax(0, 1fr) 250px; gap: 14px; min-height: 0; }
  .card { padding: 26px 18px 16px; display: grid; align-content: start; gap: 8px; }
  .card h2 { margin: 0; font-size: 15px; font-weight: 600; text-align: center; } .card h2 em { font-style: normal; color: #2fa79c; }
  .area { margin-top: 6px; height: 100%; min-height: 260px; border-radius: 18px; background: #f4efd8; display: grid; place-items: center; color: #9b8b6a; }
  .note { padding: 10px 12px; border-radius: 16px; background: #fff; font-weight: 500; box-shadow: 0 3px 0 #eadfbc; }
  .note.bad { background: #ffe9ef; box-shadow: 0 3px 0 #f6c6d4; }
  .foot { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 0 10px 0 16px; }
  .ming { display: flex; align-items: center; gap: 10px; font-weight: 500; } .ming img { width: 40px; height: 40px; border-radius: 50%; background: #fff; object-fit: cover; } .ming b { color: #e0587f; font-weight: 600; margin-right: 4px; }
  /* jelly: translucent candy body + big gloss — the whole button looks like gummy */
  .jelly { position: relative; border: 0; border-radius: 22px; padding: 12px 24px; font-size: 14px; font-weight: 600; color: #fff; cursor: pointer;
    background: radial-gradient(120% 90% at 50% 0%, #ffb6c9 0%, #f07ea0 55%, #d9577f 100%);
    box-shadow: inset 0 -6px 10px rgba(150,20,60,.35), inset 0 3px 2px rgba(255,255,255,.6), 0 6px 0 #c24f72, 0 12px 18px rgba(200,70,110,.35);
    transition: transform .14s cubic-bezier(.3,1.8,.5,1); }
  .jelly::before { content: ""; position: absolute; left: 14%; right: 14%; top: 4px; height: 38%; border-radius: 999px; background: linear-gradient(180deg, rgba(255,255,255,.85), rgba(255,255,255,0)); }
  .jelly:active { transform: translateY(4px) scale(1.06, .9); }
  .chip { padding: 5px 12px; border-radius: 999px; font-weight: 500; font-size: 12px; background: #fff; box-shadow: 0 2px 0 #e8dcb5; }
  .chip.now { background: #3fbfb4; color: #fff; box-shadow: 0 2px 0 #2a958c; }
</style>
</head>
<body>
<div class="stage">
  <header class="bubble row"><span class="logo"><img src="/assets/ASSET_003_Cat_Face_Identity_REFERENCE.png" alt="" />TraceBack</span><span class="pill">4/8 원인 역추적</span>
    <span class="dots"><i class="done">1</i><i class="done">2</i><i class="done">3</i><i class="now">4</i><i>5</i><i>6</i><i>7</i><i>8</i></span></header>
  <section class="bubble row pursuit"><b>추격차와 72 m</b><div class="track"><span></span><img src="/assets/ui/icons/police-car.svg" style="left:30%" alt="" /><img src="/assets/ui/icons/getaway-car.svg" style="left:52%" alt="" /></div></section>
  <main class="work">
    <section class="bubble card"><span class="ribbon">원인 역추적</span><h2>증상에서 거슬러 올라가 <em>처음 어긋난 구간</em>을 좁힙니다</h2>
      <div style="display:flex;gap:6px;justify-content:center"><span class="chip now">1 거꾸로 따라가기</span><span class="chip">2 의심 구간</span><span class="chip">3 영향 범위</span></div>
      <div class="area">도미노 줄 + 측정 카드 3장</div></section>
    <aside class="bubble card"><span class="ribbon teal">측정 기록</span><div class="note bad">차량 가속 · 기준 2.8 → 1.2 m/s²</div><div class="note">후보를 선택해 측정</div></aside>
  </main>
  <footer class="bubble foot"><span class="ribbon brown">엔지니어</span><div class="ming"><img src="/assets/ASSET_003_Cat_Face_Identity_REFERENCE.png" alt="" /><span><b>밍</b>먼저 어긋난 값이 원인 쪽입니다. 측정 시각을 비교하세요.</span></div><button class="jelly">시작점 확정</button></footer>
</div>
</body>
</html>

.75rem", "full": "9999px" }, "spacing": { "space-md": "1.25rem", "space-xs": "0.375rem", "space-sm": "0.75rem", "space-xl": "3rem", "space-lg": "2rem", "gutter": "1.5rem", "margin": "2.5rem" }, "fontFamily": { "headline-lg": [ "Plus Jakarta Sans" ], "body-sm": [ "Plus Jakarta Sans" ], "headline-md": [ "Plus Jakarta Sans" ], "headline-sm": [ "Plus Jakarta Sans" ], "body-md": [ "Plus Jakarta Sans" ], "body-lg": [ "Plus Jakarta Sans" ], "metric-speed": [ "Plus Jakarta Sans" ], "headline-xl": [ "Plus Jakarta Sans" ], "display-hero": [ "Plus Jakarta Sans" ], "label-caps": [ "Plus Jakarta Sans" ] }, "fontSize": { "headline-lg": [ "28px", { "lineHeight": "36px", "letterSpacing": "-0.01em", "fontWeight": "700" } ], "body-sm": [ "13px", { "lineHeight": "18px", "fontWeight": "500" } ], "headline-md": [ "22px", { "lineHeight": "30px", "fontWeight": "700" } ], "headline-sm": [ "18px", { "lineHeight": "24px", "fontWeight": "700" } ], "body-md": [ "15px", { "lineHeight": "22px", "fontWeight": "500" } ], "body-lg": [ "18px", { "lineHeight": "26px", "fontWeight": "500" } ], "metric-speed": [ "64px", { "lineHeight": "64px", "letterSpacing": "-0.03em", "fontWeight": "800" } ], "headline-xl": [ "36px", { "lineHeight": "44px", "letterSpacing": "-0.015em", "fontWeight": "800" } ], "display-hero": [ "48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "800" } ], "label-caps": [ "12px", { "lineHeight": "16px", "letterSpacing": "0.06em", "fontWeight": "800" } ] } } } };</script></head><body class="bg-surface text-on-surface font-body-md text-body-md select-none"><main class="w-full min-h-screen relative overflow-hidden bg-surface flex flex-col justify-center items-center"><div class="flex flex-col w-full">

</div>

<!-- Right: Cinematic Skip & Telemetry Capsule -->

<span class="font-label-caps text-label-caps text-surface-variant">KM/H</span>
</div>
<button class="flex items-center gap-1.5 px-5 py-3 rounded-full bg-surface-container/90 hover:bg-surface-container-lowest text-on-surface font-headline-sm text-headline-sm shadow-xl hover:scale-105 active:translate-y-1 transition duration-150 cursor-pointer" id="skip-btn" type="button">
<span>SKIP</span>
<span class="material-symbols-outlined text-[18px]">fast_forward</span>
</button>

<!-- Center Screen Climax Focal Cues (Subtle Cinematic Prompt) -->

<div class="text-center opacity-40 hover:opacity-80 transition-opacity">
<div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-inverse-surface/60 backdrop-blur-sm text-surface-bright text-body-sm font-body-sm">

<span>목표 지점: 노틸러스호 승선 램프 (180m 앞)</span>
</div>
</div>
</div>
<!-- Bottom Dialogue Novel Overlay & Interactive Stepper -->
<section class="absolute bottom-6 inset-x-4 md:inset-x-12 lg:inset-x-20 z-40 pointer-events-auto">
<div class="relative bg-inverse-surface/92 backdrop-blur-xl rounded-3xl p-5 md:p-7 shadow-2xl overflow-hidden shadow-black/60">
<!-- Ambient Top Clay Highlight Bevel -->
<div class="absolute top-0 inset-x-0 h-1 bg-gradient-to-r from-transparent via-surface-bright/25 to-transparent"></div>
<div class="flex flex-col md:flex-row items-center md:items-start gap-6 relative">
<!-- Character Clay Avatar Pod -->
<div class="relative shrink-0 flex flex-col items-center">

<div class="absolute -bottom-1 -right-1 px-2.5 py-0.5 rounded-full bg-secondary-container text-on-secondary font-label-caps text-label-caps shadow-md uppercase" id="badge-role">
                DRIVER
              </div>
</div>
</div>
<!-- Dialogue Content Block -->
<div class="flex-1 flex flex-col justify-between min-h-[92px] w-full">
<div>
<!-- Speaker Nameplate & State Badges -->
<div class="flex items-center justify-between mb-2">
<div class="flex items-center gap-3">

<span class="font-body-sm text-body-sm px-2.5 py-0.5 rounded-full bg-surface-container/20 text-surface-variant flex items-center gap-1" id="speaker-emotion">
<span class="w-1.5 h-1.5 rounded-full bg-secondary animate-ping"></span>
                    긴급 조작 중
                  </span>
</div>
<div class="flex items-center gap-1 text-surface-variant/80 font-label-caps text-label-caps">
<span class="text-surface-bright font-headline-sm" id="step-counter">1</span> / 4
                </div>
</div>
<!-- Main Dynamic Dialogue Text -->
<p class="font-headline-lg text-headline-lg text-surface-bright tracking-tight leading-relaxed min-h-[56px] transition-opacity duration-200" id="dialogue-text">
                “저기야!! 저 배만 타면 도망칠 수 있어!”
              </p>
</div>
<!-- Footer Action Controls & Step Progress -->
<div class="mt-4 pt-3 flex flex-wrap items-center justify-between gap-4">
<!-- Hotkey Hints -->
<div class="flex items-center gap-3 text-body-sm font-body-sm text-surface-variant/80">
<div class="inline-flex items-center gap-1.5 bg-surface/10 px-2.5 py-1 rounded-lg text-surface-bright font-label-caps text-label-caps">

<span>다음 대사</span>
</div>
<span class="text-surface-dim">|</span>
<div class="inline-flex items-center gap-1.5 bg-surface/10 px-2.5 py-1 rounded-lg text-surface-bright font-label-caps text-label-caps">
<span class="px-1.5 py-0.5 rounded bg-surface/20 text-surface-bright">ENTER</span>

</div>
</div>
<!-- Stepper Progress Pips + Final Launch Action -->

<span class="w-2 h-2 rounded-full bg-surface-dim/40 transition-all" data-pip="1"></span>
<span class="w-2 h-2 rounded-full bg-surface-dim/40 transition-all" data-pip="2"></span>
<span class="w-2 h-2 rounded-full bg-surface-dim/40 transition-all" data-pip="3"></span>
</div>
<!-- Next Dialogue Button -->
<button class="flex items-center gap-2 px-6 py-2.5 rounded-full bg-surface-container-high text-on-surface font-headline-sm text-headline-sm shadow-md hover:bg-surface-container-lowest active:translate-y-1 transition duration-150 cursor-pointer" id="next-step-btn" type="button">
<span>다음</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
<!-- Final Launch Button (Revealed at Step 4) -->
<button class="hidden items-center gap-3 px-8 py-3 rounded-full bg-secondary-container text-on-secondary font-headline-md text-headline-md shadow-2xl hover:scale-105 active:translate-y-1 transition duration-200 cursor-pointer animate-pulse" id="launch-race-btn" type="button">
<span>선박 램프 최종 돌파 레이싱 시작</span>
<span class="material-symbols-outlined text-[24px]">rocket_launch</span>
</button>
</div>
</div>
</div>
</div>
</div>
</section>
<!-- Full Throttle Speed Lines Dynamic Flash Overlay (Triggered on Finale) -->
<div class="absolute inset-0 pointer-events-none opacity-0 transition-opacity duration-300 bg-gradient-to-t from-secondary/30 via-transparent to-primary-container/20 flex items-center justify-center" id="boost-overlay">
<div class="text-center transform scale-90 transition-transform duration-300" id="boost-text-group">
<span class="font-display-hero text-display-hero text-surface-bright drop-shadow-2xl">MAXIMUM OVERDRIVE!</span>
<p class="font-headline-md text-headline-md text-primary-fixed drop-shadow-md">경사로 전속력 돌파 개시</p>
</div>
</div>
</div>
<script>
    (function() {
      const scriptLines = [
        {
          speaker: "드라이버 루 (Lou)",
          role: "DRIVER",
          roleColor: "bg-secondary-container",
          textColor: "text-primary-fixed",
          emotion: "긴급 조작 중",
          avatar: "https://lh3.googleusercontent.com/aida-public/AB6AXuCTHOqieKo8C-mJQ6V0EU5I4yCcDBp3pSRLtS1NMVH1LZfRy9HrHwqQuKiH3pxcVFZFbKW6EuM1AYzpHung9IzqaNb7Z9jLJt5nMbKXP5EacQDY6LYXeycblgek7qDwTH7zujuOJqwj8vDqPvMbUGfJWUum7CTk7WxDS9usnCnOSIp_H2uKnLq9DY5EAou2OAFrLDYwr50rm-TzjLu_cJFOpFz5LXm20FCEqky0h-X3VDABisBuIEwRYg",
          text: "“저기야!! 저 배만 타면 도망칠 수 있어!”"
        },
        {
          speaker: "엔지니어 밍 (Ming)",
          role: "ENGINEER",
          roleColor: "bg-tertiary-container",
          textColor: "text-tertiary-fixed",
          emotion: "경보 감지",
          avatar: "https://lh3.googleusercontent.com/aida-public/AB6AXuBDAqMdilPEI-7iFV4zFmpJfo19pIBmuAqZHHFbonCg2R1dF4kdx9zK-IWItQyDmZcD5_ZG0a7rIl_0pI0J7JsX0l6VzNCsbD7znN2D25PCX703wdfNJUFpzrXOxA3SsJm8WyDJ6l0lpQd63YylCLJwMA528dD1sb2w7x9D5nyviPTGJqiXaaPQedU_1ky7Z8AhoGcYL4h8Tkk732GL2a4avMpIPt4Q_Haeet-dKZfzZ6v3tPBXKU0Muw",
          text: "“잠깐, 갑판을 올리고 있잖아?!”"
        },
        {
          speaker: "드라이버 루 (Lou)",
          role: "DRIVER",
          roleColor: "bg-secondary-container",
          textColor: "text-primary-fixed",
          emotion: "부스터 최대 충전",
          avatar: "https://lh3.googleusercontent.com/aida-public/AB6AXuCTHOqieKo8C-mJQ6V0EU5I4yCcDBp3pSRLtS1NMVH1LZfRy9HrHwqQuKiH3pxcVFZFbKW6EuM1AYzpHung9IzqaNb7Z9jLJt5nMbKXP5EacQDY6LYXeycblgek7qDwTH7zujuOJqwj8vDqPvMbUGfJWUum7CTk7WxDS9usnCnOSIp_H2uKnLq9DY5EAou2OAFrLDYwr50rm-TzjLu_cJFOpFz5LXm20FCEqky0h-X3VDABisBuIEwRYg",
          text: "“뭐?! 안 돼!! 얼른 가자!”"
        },
        {
          speaker: "엔지니어 밍 (Ming)",
          role: "ENGINEER",
          roleColor: "bg-tertiary-container",
          textColor: "text-tertiary-fixed",
          emotion: "출력 리미트 해제",
          avatar: "https://lh3.googleusercontent.com/aida-public/AB6AXuBDAqMdilPEI-7iFV4zFmpJfo19pIBmuAqZHHFbonCg2R1dF4kdx9zK-IWItQyDmZcD5_ZG0a7rIl_0pI0J7JsX0l6VzNCsbD7znN2D25PCX703wdfNJUFpzrXOxA3SsJm8WyDJ6l0lpQd63YylCLJwMA528dD1sb2w7x9D5nyviPTGJqiXaaPQedU_1ky7Z8AhoGcYL4h8Tkk732GL2a4avMpIPt4Q_Haeet-dKZfzZ6v3tPBXKU0Muw",
          text: "“마지막 스퍼트야! 이번엔 반드시 성공해야 해!”"
        }
      ];

      let currentIndex = 0;
      let policeMeters = 148;

      const speakerName = document.getElementById('speaker-name');
      const speakerEmotion = document.getElementById('speaker-emotion');
      const speakerAvatar = document.getElementById('speaker-avatar');
      const badgeRole = document.getElementById('badge-role');
      const dialogueText = document.getElementById('dialogue-text');
      const stepCounter = document.getElementById('step-counter');
      const nextStepBtn = document.getElementById('next-step-btn');
      const launchBtn = document.getElementById('launch-race-btn');
      const skipBtn = document.getElementById('skip-btn');
      const pips = document.querySelectorAll('[data-pip]');
      const policeDistEl = document.getElementById('police-dist');
      const tensionFill = document.getElementById('tension-fill');
      const bgCutscene = document.getElementById('bg-cutscene');
      const boostOverlay = document.getElementById('boost-overlay');

      function updateUI(index) {
        const item = scriptLines[index];
        
        // Avatar swap with punch animation
        speakerAvatar.classList.add('opacity-0', 'scale-95');
        dialogueText.classList.add('opacity-0');
        
        setTimeout(() => {
          speakerAvatar.src = item.avatar;
          speakerAvatar.alt = item.speaker;
          speakerName.textContent = item.speaker;
          speakerName.className = `font-headline-md text-headline-md ${item.textColor}`;
          badgeRole.textContent = item.role;
          badgeRole.className = `absolute -bottom-1 -right-1 px-2.5 py-0.5 rounded-full ${item.roleColor} text-on-secondary font-label-caps text-label-caps shadow-md uppercase`;
          speakerEmotion.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-secondary animate-ping"></span> ${item.emotion}`;
          dialogueText.textContent = item.text;
          stepCounter.textContent = (index + 1);

          speakerAvatar.classList.remove('opacity-0', 'scale-95');
          dialogueText.classList.remove('opacity-0');
        }, 120);

        // Update Pips
        pips.forEach((pip, pIdx) => {
          if (pIdx === index) {
            pip.className = 'w-4 h-2 rounded-full bg-primary-container transition-all duration-200';
          } else if (pIdx < index) {
            pip.className = 'w-2 h-2 rounded-full bg-primary-fixed-dim transition-all duration-200';
          } else {
            pip.className = 'w-2 h-2 rounded-full bg-surface-dim/40 transition-all duration-200';
          }
        });

        // Tension increase as dialogue progresses
        policeMeters = Math.max(45, 148 - (index * 26));
        policeDistEl.textContent = policeMeters;
        const tensionPercent = 75 + (index * 7);
        tensionFill.style.width = tensionPercent + '%';

        // Camera dynamic zoom step
        bgCutscene.style.transform = `scale(${1.05 + (index * 0.035)})`;

        // At last step, surface the prominent action CTA
        if (index === scriptLines.length - 1) {
          nextStepBtn.classList.add('hidden');
          launchBtn.classList.remove('hidden');
          launchBtn.classList.add('inline-flex');
        } else {
          nextStepBtn.classList.remove('hidden');
          launchBtn.classList.add('hidden');
          launchBtn.classList.remove('inline-flex');
        }
      }

      function advanceDialogue() {
        if (currentIndex < scriptLines.length - 1) {
          currentIndex++;
          updateUI(currentIndex);
        } else {
          triggerLaunch();
        }
      }

      function triggerLaunch() {
        boostOverlay.classList.remove('opacity-0');
        boostOverlay.classList.add('opacity-100');
        const textBox = document.getElementById('boost-text-group');
        if (textBox) {
          textBox.classList.remove('scale-90');
          textBox.classList.add('scale-105');
        }
        
        launchBtn.innerHTML = `<span>점프 램프 진입 중...</span><span class="material-symbols-outlined animate-spin text-[24px]">progress_activity</span>`;
        launchBtn.classList.remove('bg-secondary-container');
        launchBtn.classList.add('bg-primary-container');

        setTimeout(() => {
          launchBtn.innerHTML = `<span>탈출 성공! 스테이지 클리어!</span><span class="material-symbols-outlined text-[24px]">check_circle</span>`;
        }, 1600);
      }

      nextStepBtn.addEventListener('click', advanceDialogue);
      launchBtn.addEventListener('click', triggerLaunch);

      skipBtn.addEventListener('click', () => {
        currentIndex = scriptLines.length - 1;
        updateUI(currentIndex);
      });

      // Keyboard Controls: Space for Next, Enter for Final Race Launch
      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
          e.preventDefault();
          advanceDialogue();
        } else if (e.code === 'Enter') {
          e.preventDefault();
          if (currentIndex === scriptLines.length - 1) {
            triggerLaunch();
          } else {
            advanceDialogue();
          }
        }
      });

      // Background distance slight jitter for tension effect
      setInterval(() => {
        if (currentIndex < scriptLines.length - 1) {
          const jitter = (Math.random() * 2 - 1).toFixed(0);
          const currentVal = parseInt(policeDistEl.textContent, 10);
          policeDistEl.textContent = Math.max(30, currentVal + parseInt(jitter, 10));
        }
      }, 2400);
    })();
  </script>
</div></main></body></html>

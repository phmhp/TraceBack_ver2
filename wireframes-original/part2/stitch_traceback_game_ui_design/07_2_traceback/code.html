<img alt="Driver Cat Lou profile avatar" class="w-full h-full object-cover rounded-full" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCTHOqieKo8C-mJQ6V0EU5I4yCcDBp3pSRLtS1NMVH1LZfRy9HrHwqQuKiH3pxcVFZFbKW6EuM1AYzpHung9IzqaNb7Z9jLJt5nMbKXP5EacQDY6LYXeycblgek7qDwTH7zujuOJqwj8vDqPvMbUGfJWUum7CTk7WxDS9usnCnOSIp_H2uKnLq9DY5EAou2OAFrLDYwr50rm-TzjLu_cJFOpFz5LXm20FCEqky0h-X3VDABisBuIEwRYg"/>
</div>
<div class="absolute -bottom-1 -right-1 bg-secondary text-on-secondary w-6 h-6 rounded-full flex items-center justify-center text-[12px] shadow-sm">

</div>

<!-- Dialogue Line -->
<div class="flex flex-col min-w-0">

<article class="bg-inverse-surface/90 backdrop-blur-md p-space-md rounded-xl flex items-center gap-space-md shadow-2xl transition-all duration-300 hover:bg-inverse-surface">

<div class="w-16 h-16 rounded-full overflow-hidden bg-surface-variant shadow-inner p-1">

</button>

          </span>

<script>
  // Keyboard event handler for standard PC Game cutscene hotkeys
  document.addEventListener('keydown', function(event) {
    if (event.code === 'Space') {
      event.preventDefault();
      triggerAction('체크포인트 재도전');
    } else if (event.key === 'r' || event.key === 'R' || event.key === 'ㄱ') {
      event.preventDefault();
      triggerAction('가설 재검증');
    } else if (event.key === 'Escape') {
      event.preventDefault();
      triggerAction('메인 메뉴');
    }
  });

  function triggerAction(actionName) {
    const feedbackToast = document.createElement('div');
    feedbackToast.className = 'fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-inverse-surface text-inverse-on-surface px-6 py-3 rounded-full shadow-2xl font-headline-sm text-headline-sm z-50 pointer-events-none transition-opacity duration-300 opacity-0';
    feedbackToast.textContent = actionName + ' 로딩 중...';
    document.body.appendChild(feedbackToast);

    requestAnimationFrame(() => {
      feedbackToast.classList.remove('opacity-0');
      feedbackToast.classList.add('opacity-100');
    });

    setTimeout(() => {
      feedbackToast.classList.remove('opacity-100');
      feedbackToast.classList.add('opacity-0');
      setTimeout(() => feedbackToast.remove(), 300);
    }, 1200);
  }
</script></main></body></html>
